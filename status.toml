#WARNING: as this file contains credentials, be sure to set correct file permissions
[api]
    [api.myapi]
    BindAddress="127.0.0.1:4242"
    Buffer=1000
    RemoteNickFormat="{NICK}: "

[status]
    [status.mystatus]
    # status private key
    Token=""
    RemoteNickFormat="{NICK}"
    DataDir="path to status data dir"
    NodeConfigFile="path to json with node config and fleets"
    PreserveThreading=true
    #Maximum length of message sent to irc server. If it exceeds
    #<clipped message> will be add to the message.
    #OPTIONAL (default 400)
    MessageLength=1600
    #Maximum amount of messages to hold in queue. If queue is full
    #messages will be dropped.
    #<clipped message> will be add to the message that fills the queue.
    #OPTIONAL (default 30)
    MessageQueue=100

[discord]
    [discord.mydiscord]
    Token=""
    Server=""
    AutoWebhooks=true
    RemoteNickFormat="{NICK}"
    PreserveThreading=true
    #Maximum length of message sent to irc server. If it exceeds
    #<clipped message> will be add to the message.
    #OPTIONAL (default 400)
    MessageLength=1600
    #Maximum amount of messages to hold in queue. If queue is full
    #messages will be dropped.
    #<clipped message> will be add to the message that fills the queue.
    #OPTIONAL (default 30)
    MessageQueue=100

[[gateway]]
name="gateway3"
enable=true
    [[gateway.inout]]
    account="status.mystatus"
    channel=""

    [[gateway.inout]]
    account="discord.mydiscord"
    channel="general"

